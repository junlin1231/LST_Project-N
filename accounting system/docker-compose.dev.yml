services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: deps
    env_file:
      - .env.local
    # /app/node_modules is a Docker volume, so refresh it from pnpm-lock.yaml before starting Next.
    command: sh -c "CI=true pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      AUTO_MIGRATE: '1'
      DOCUMENT_STORAGE_ROOT: /app/data/scanned_docs
      OCR_STORAGE_DIR: /app/ocr/scanned_docs
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - document_data:/app/data
      - ../ocr/scanned_docs:/app/ocr/scanned_docs
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  admin_web:
    build:
      context: ../admin_panel
      dockerfile: Dockerfile
    env_file:
      - .env.local
    volumes:
      - ../admin_panel:/app
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  document_data:
