services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      AUTO_MIGRATE: '1'
      DOCUMENT_STORAGE_ROOT: /app/data/scanned_docs
    volumes:
      - document_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin_web:
    build:
      context: ../admin_panel
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
