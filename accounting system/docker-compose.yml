services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      POSTGRES_USER: ${POSTGRES_USER:-accounting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accounting -d accounting']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      AUTO_MIGRATE: '1'
      DATABASE_URL: postgresql://${POSTGRES_USER:-accounting}:${POSTGRES_PASSWORD:-accounting}@db:5432/${POSTGRES_DB:-accounting}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-dev-only-change-me}
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME:-lst_access_token}
      DJANGO_LOGIN_URL: ${DJANGO_LOGIN_URL:-http://localhost:8000/login/}
      DOCUMENT_STORAGE_ROOT: /app/data/scanned_docs
    volumes:
      - document_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
